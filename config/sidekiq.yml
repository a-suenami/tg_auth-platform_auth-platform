development:
  :verbose: true
  :concurrency: 4
test:
  :verbose: true
  :concurrency: 4
staging:
  :concurrency: <%= (ENV['RAILS_MAX_THREADS'] || 5).to_i - 1 %>
production:
  :concurrency: <%= (ENV['RAILS_MAX_THREADS'] || 5).to_i - 1 %>
:queues: # queues are named by priority
  - [realtime_priority, 8]
  - [high_priority, 4]
  - [default, 2]
  - [low_priority, 1]
:scheduler:
  :schedule:
    expire_email_verifiers:
      cron: '0 0 0 1 * *'
      class: ExpireEmailVerifiersWorker
    delivery_orchestrator:
      cron: '* * * * *'
      class: Deliveries::OrchestratorWorker
      queue: default
      description: 'Orchestrate delivery workers: setup, import confirmation, result sync'
    user_auto_tagging_daily:
      cron: '0 0 0 * * *'
      class: UserAutoTagging::DailyWorker
