      artifacts: false

🚀 deploy:app:production:
  <<: *deploy-production-base
  stage: deploy
  script:
    - ecspresso deploy --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/prod/services/app/config.yaml
  needs:
