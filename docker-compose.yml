# ==============================================================================
# docker-compose
# ==============================================================================
version: '3.9'
services:
  # ----------------------------------------------------------------------------
  app: &triple-app-base
  # ----------------------------------------------------------------------------
    build:
      context: .
      dockerfile: docker/local.Dockerfile
      args:
        RAILS_ENV: development
    command: bundle exec rails server -b 0.0.0.0 -p '3000'
    ports:
      - '3000:3000'
    links:
      - postgres
      - postgres_tmpfs
      - redis
      - dynamodb
    environment:
      LANG: 'C.UTF-8'
      POSTGRES_HOST: postgres
      POSTGRES_TEST_HOST: postgres_tmpfs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
      SPRING_SOCKET: 'tmp/pids/spring.sock'
      SPRING_SERVER_COMMAND: 'docker-compose up spring'
      RUBYOPT: '-W:no-deprecated -W:no-experimental'
      VITE_RUBY_HOST: vite-dev-server
    volumes:
      - .:/rails_app
      - bundle-data:/usr/local/bundle
    stdin_open: true
    tty: true


  # # ----------------------------------------------------------------------------
  # worker:
  # # ----------------------------------------------------------------------------
  #   <<: *triple-app-base
  #   build:
  #     context: .
  #     dockerfile: docker/local.Dockerfile
  #     args:
  #       RAILS_ENV: development
  #   ports: []
  #   command: bundle exec sidekiq -C config/sidekiq.yml


  # ----------------------------------------------------------------------------
  spring:
  # ----------------------------------------------------------------------------
    <<: *triple-app-base
    ports: []
    command: bundle exec bin/spring server
    pid: host


  # ----------------------------------------------------------------------------
  vite-dev-server:
  # ----------------------------------------------------------------------------
    <<: *triple-app-base
    command: ./bin/vite dev
    environment:
      VITE_RUBY_HOST: '0.0.0.0'
      VITE_SERVER_HMR_HOST:
      VITE_SERVER_HMR_PORT:
    ports:
      - '3036:3036'


  # ----------------------------------------------------------------------------
  postgres:
  # ----------------------------------------------------------------------------
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data


  # ----------------------------------------------------------------------------
  postgres_tmpfs:
  # ----------------------------------------------------------------------------
    image: postgres:15-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data


  # ----------------------------------------------------------------------------
  redis:
  # ----------------------------------------------------------------------------
    image: redis:7.0-alpine
    ports:
      - '6379:6379'
    command: [redis-server, --loglevel, notice]
    volumes:
      - redis-data:/data


  # ----------------------------------------------------------------------------
  dynamodb:
  # ----------------------------------------------------------------------------
    build:
      context: .
      dockerfile: docker/dynamodb/Dockerfile
    environment:
      _JAVA_OPTIONS: -Xmx128m
    ports:
      - 8000:8000
    volumes:
      - dynamodb-data:/home/dynamodblocal/data


# ----------------------------------------------------------------------------
volumes:
# ----------------------------------------------------------------------------
  bundle-data: {}
  postgres-data: {}
  redis-data: {}
  dynamodb-data: {}
